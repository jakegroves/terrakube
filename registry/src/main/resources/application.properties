server.port=8075

##################################
#/.well-known/terraform.json Data#
##################################
io.terrakube.registry.hostname=${AzBuilderRegistry}
io.terrakube.registry.clientId=${AppClientId}
io.terrakube.registry.issuerUri=${AppIssuerUri}

#####################
#Authentication Type#
#####################
io.terrakube.registry.authentication.type=${AuthenticationValidationTypeRegistry}

##################
#Terrakube Client#
##################
io.terrakube.client.enableSecurity = ${TerrakubeEnableSecurity}
io.terrakube.client.url=${AzBuilderApiUrl}
io.terrakube.client.secretKey=${InternalSecret}
io.terrakube.client.credentialType=INTERNAL

#################
#Storage Service#
#################
io.terrakube.registry.plugin.storage.type=${RegistryStorageType}
#################
# AZURE Storage #
#################
io.terrakube.registry.plugin.storage.azure.accountName=${AzureAccountName}
io.terrakube.registry.plugin.storage.azure.accountKey=${AzureAccountKey}
###############
# AWS Storage #
###############
io.terrakube.registry.plugin.storage.aws.accessKey=${AwsStorageAccessKey}
io.terrakube.registry.plugin.storage.aws.secretKey=${AwsStorageSecretKey}
io.terrakube.registry.plugin.storage.aws.bucketName=${AwsStorageBucketName}
io.terrakube.registry.plugin.storage.aws.region=${AwsStorageRegion}
io.terrakube.registry.plugin.storage.aws.endpoint=${AwsEndpoint}
io.terrakube.registry.plugin.storage.aws.enableRoleAuthentication=${AwsEnableRoleAuth:false}
###############
# GCP Storage #
###############
io.terrakube.registry.plugin.storage.gcp.credentials=${GcpStorageCredentialsBase64}
io.terrakube.registry.plugin.storage.gcp.bucketName=${GcpStorageBucketName}
io.terrakube.registry.plugin.storage.gcp.projectId=${GcpStorageProjectId}

########
# Cors #
########
io.terrakube.ui.fqdn=${TerrakubeUiURL}

##########
# HEALTH #
##########
# /actuator/prometheus carries no auth of its own - restrict scraping at the network/ingress
# layer (in-cluster only), matching how /actuator/health is exposed unauthenticated for probes.
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.enabled=true
management.endpoints.enabled-by-default=false
# enabled-by-default=false means every endpoint past 'health' must also be turned on explicitly -
# exposure alone is not enough, the endpoint 404s without this.
management.endpoint.prometheus.enabled=true
management.endpoint.info.enabled=true
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

###########
# LOGGING #
###########
# ECS-JSON on stdout so a log collector can parse fields and correlate by trace id. The
# OpenTelemetry Java agent injects trace_id / span_id / trace_flags into MDC at runtime; they
# appear in every line here and in the OTLP log records the agent ships. The 'local' profile
# (application-local.properties) reverts to human-readable output.
logging.structured.format.console=ecs

######################
# DEX AUTHENTICATION #
######################
io.terrakube.token.pat=${PatSecret}
io.terrakube.token.internal=${InternalSecret}
io.terrakube.token.issuer-uri=${DexIssuerUri}

##################################
# CACHE FEDERATED AUTHENTICATION #
##################################
io.terrakube.registry.federatedCacheExpireAfterWrite=${FederatedCacheExpireAfterWrite:10}
io.terrakube.registry.federatedCacheMaximumSize=${FederatedCacheMaximumSize:1000}
io.terrakube.registry.providerManagerCacheExpireAfterWrite=${ProviderManagerCacheExpireAfterWrite:60}
io.terrakube.registry.providerManagerCacheMaximumSize=${ProviderManagerCacheMaximumSize:100}


########################
# MODULE REGISTRY CACHE #
########################
# Time to live of the module version list. This is the delay between the API storing a new module
# version and the registry serving it, so lower it when modules are released often. The module
# download path cache is not configurable: the version is part of its key, so it cannot go stale.
io.terrakube.registry.moduleVersionsCacheTtlSeconds=${ModuleVersionsCacheTtlSeconds:600}
