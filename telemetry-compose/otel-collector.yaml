# OpenTelemetry Collector - local dev. Receives OTLP (traces + logs) from the Java agents and
# the browser, fans out to Tempo and VictoriaLogs. Metrics are NOT handled here - VictoriaMetrics
# scrapes /actuator/prometheus directly (pull model, same as production).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://terrakube-ui:3000"
            - "http://localhost:3000"

processors:
  batch: {}
  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/victorialogs:
    logs_endpoint: http://victoria-logs:9428/insert/opentelemetry/v1/logs
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlphttp/victorialogs]
