# Observability BACKEND ONLY - for the from-source dev loop.
#
# Run api / executor / registry / ui from source (VS Code "Terrakube + Observability"
# compound, or `setupDevelopmentEnvironment.sh -o`); this file provides just the
# collector + stores + Grafana. Services push OTLP to localhost:4318 and expose
# /actuator/prometheus, which VictoriaMetrics scrapes via the docker host gateway.
#
#   docker compose -f telemetry-compose/backend.yml up -d
#   Grafana: http://localhost:3001
#
# For the full stack with prebuilt service images, use docker-compose.yaml instead.

name: terrakube-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    mem_limit: 150m
    depends_on: [tempo, victoria-logs]

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.150.0
    command:
      - --promscrape.config=/etc/vm/scrape.yaml
      - --retentionPeriod=3d
      - --selfScrapeInterval=15s
    volumes:
      - ./backend-scrape.yaml:/etc/vm/scrape.yaml:ro
      - vm_data:/victoria-metrics-data
    ports:
      - "8428:8428"
    mem_limit: 256m
    extra_hosts:
      - "host.docker.internal:host-gateway"

  victoria-logs:
    image: victoriametrics/victoria-logs:v1.51.1
    command: ["--retentionPeriod=3d"]
    volumes:
      - vlogs_data:/victoria-logs-data
    ports:
      - "9428:9428"
    mem_limit: 128m

  tempo:
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    mem_limit: 384m

  grafana:
    image: grafana/grafana:11.6.6
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_INSTALL_PLUGINS: "victoriametrics-logs-datasource"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    mem_limit: 256m
    depends_on: [victoriametrics, tempo, victoria-logs]

volumes:
  vm_data:
  vlogs_data:
  tempo_data:
