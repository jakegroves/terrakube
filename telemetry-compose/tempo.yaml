server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://victoriametrics:8428/api/v1/write
        send_exemplars: true
  processor:
    span_metrics:
      dimensions: [service.name, span.name, span.kind, status.code, http.route]
      histogram_buckets: [0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30, 60]
    service_graphs:
      dimensions: [http.route]
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
