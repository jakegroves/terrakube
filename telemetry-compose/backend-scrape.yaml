# VictoriaMetrics scrape config for the FROM-SOURCE dev loop: the api / executor /
# registry processes run on the host (or in the devcontainer), so scrape them via
# the docker host gateway rather than compose service names.
# api / executor / registry each emit their own `service` label (Micrometer common
# tag); only the non-Terrakube targets below need it injected here.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: terrakube-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: terrakube-executor
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8090"]
  - job_name: terrakube-registry
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8075"]
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8888"]
        labels: { service: otel-collector }
  - job_name: victoria-logs
    metrics_path: /metrics
    static_configs:
      - targets: ["victoria-logs:9428"]
        labels: { service: victoria-logs }
  - job_name: tempo
    metrics_path: /metrics
    static_configs:
      - targets: ["tempo:3200"]
        labels: { service: tempo }
