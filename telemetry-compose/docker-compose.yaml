services:
  terrakube-api:
    image: azbuilder/api-server:2.17.0
    ports:
      - 8080:8080
    env_file:
      - api.env
  terrakube-ui:
    image: azbuilder/terrakube-ui:2.17.0
    ports:
      - 3000:8080
    volumes:
      - ./env-config.js:/app/env-config.js
    env_file:
      - ui.env
  terrakube-executor:
    image: azbuilder/executor:2.17.0
    ports:
      - 8090:8090
    env_file:
      - executor.env
  terrakube-registry:
    image: azbuilder/open-registry:2.17.0
    ports:
      - 8075:8075
    env_file:
      - registry.env
  terrakube-dex:
    image: ghcr.io/dexidp/dex:v2.37.0
    volumes:
      - ./config-ldap.yaml:/etc/dex/config.docker.yaml
    ports:
      - 5556:5556
  ldap-service:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: "Example, Inc"
      LDAP_DOMAIN: "example.org"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_TLS: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    volumes:
      - ./ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom
    ports:
      - 389:389
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - 'minio_data:/data'
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: ["/bin/sh","-c","until /usr/bin/mc alias set tk http://minio:9000 minioadmin minioadmin; do echo 'waiting for minio'; sleep 2; done; /usr/bin/mc mb --ignore-existing tk/sample; exit 0;"]
  redis-service:
    image: valkey/valkey:8-alpine
    command:
      - valkey-server
      - --requirepass
      - password123456
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - FLUSHALL
      - ""
    ports:
      - '6379:6379'
    volumes:
      - 'redis_data:/data'
  # ---------------------------------------------------------------------------
  # Telemetry backend - a laptop-sized mirror of the production topology.
  # Traces + logs are pushed over OTLP to the collector; metrics are pulled by
  # VictoriaMetrics scraping /actuator/prometheus. Storage is ephemeral.
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
      - victoria-logs

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.150.0
    command:
      - --promscrape.config=/etc/vm/scrape.yaml
      - --retentionPeriod=3d
      - --selfScrapeInterval=15s
    volumes:
      - ./victoriametrics-scrape.yaml:/etc/vm/scrape.yaml:ro
      - vm_data:/victoria-metrics-data
    ports:
      - "8428:8428"

  victoria-logs:
    image: victoriametrics/victoria-logs:v1.51.1
    command:
      - --retentionPeriod=3d
    volumes:
      - vlogs_data:/victoria-logs-data
    ports:
      - "9428:9428"

  tempo:
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana:11.6.6
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_INSTALL_PLUGINS: "victoriametrics-logs-datasource"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - victoriametrics
      - tempo
      - victoria-logs

volumes:
  minio_data:
  redis_data:
  vm_data:
  vlogs_data:
  tempo_data: